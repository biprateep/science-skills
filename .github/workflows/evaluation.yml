name: Shared skill evaluation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.16,<0.17' 'mypy>=1.10,<2'
      - name: Validate discovery and coverage
        run: python -m evaluation validate --require-coverage
      - name: Test framework and grading negative controls
        run: python -m pytest --import-mode=importlib evaluation/tests skills/*/evals/tests -q
      - name: Calibrate references (not an agent benchmark)
        run: python -m evaluation run --runner replay --repeats 2
      - name: Check framework style and types
        run: |
          ruff format --check --config skills/code-style/assets/ruff.toml evaluation
          ruff check --config skills/code-style/assets/ruff.toml evaluation
          mypy --config-file skills/code-style/assets/mypy.ini evaluation
