# mypy configuration for the code-style skill, standing in for pytype, which
# the Google Python Style Guide names but which is discontinued (Python 3.12
# is its last supported version). Section numbers (§) are the guide's.
#
# In a project: copy to the project root as mypy.ini, or move the options
# into [tool.mypy] in pyproject.toml. On loose files:
#   uvx --with-requirements script.py mypy --config-file <skill-dir>/assets/mypy.ini script.py

[mypy]
# §3.19.15: a generic type always carries its type parameters.
disallow_any_generics = True
# §2.21: a signature is annotated completely or not at all.
disallow_incomplete_defs = True
# Bodies of unannotated functions are still checked.
check_untyped_defs = True
# §3.19.5: `x: str = None` is an error; write `x: str | None = None`.
no_implicit_optional = True
# §2.1: a suppression that no longer suppresses anything is reported.
warn_unused_ignores = True
warn_redundant_casts = True
# Many scientific packages ship no type information; importing them is not an
# error, but misspelled or missing modules still are.
disable_error_code = import-untyped
